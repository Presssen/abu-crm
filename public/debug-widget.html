<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU Chat Widget Diagnostic</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f0f0f0; }
        .test-box { border: 1px solid #ccc; background: white; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .log { background: #333; color: #0f0; padding: 1rem; height: 200px; overflow-y: auto; border-radius: 4px; }
        iframe { border: 1px dashed blue; }
    </style>
</head>
<body>
    <h1>ABU Chat Widget Diagnostic</h1>
    
    <div class="test-box">
        <h3>1. Direct Iframe Test</h3>
        <p>Trying to load iframe directly below. If it shows "refused to connect" or is blank, CSP/Headers are blocking it.</p>
        <div style="width: 350px; height: 500px; position: relative;">
            <iframe id="test-iframe" src="https://crm.abuapp.io/chat-widget" width="100%" height="100%"></iframe>
        </div>
    </div>

    <div class="test-box">
        <h3>2. Script Injection Test</h3>
        <button onclick="injectScript()">Inject Script Now</button>
        <div id="script-status">Waiting...</div>
    </div>

    <div class="test-box">
        <h3>3. Console Logs</h3>
        <div id="console-log" class="log"></div>
    </div>

    <script>
        // Override console.log to show on screen
        const originalLog = console.log;
        const originalError = console.error;
        const logBox = document.getElementById('console-log');

        function appendLog(type, args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            const div = document.createElement('div');
            div.textContent = `[${type}] ${msg}`;
            div.style.color = type === 'ERROR' ? '#ff5555' : '#0f0';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        console.log = (...args) => { originalLog(...args); appendLog('INFO', args); };
        console.error = (...args) => { originalError(...args); appendLog('ERROR', args); };
        console.warn = (...args) => { originalLog(...args); appendLog('WARN', args); };

        function injectScript() {
            console.log('Injecting embed.js...');
            const script = document.createElement('script');
            script.src = "https://crm.abuapp.io/embed.js";
            script.async = true;
            script.onload = () => console.log('Script loaded successfully');
            script.onerror = (e) => console.error('Script failed to load', e);
            document.body.appendChild(script);
        }

        // Check iframe load
        const iframe = document.getElementById('test-iframe');
        iframe.onload = () => console.log('Iframe onload event fired (content loaded or blocked)');
        
        console.log('Diagnostic page ready. origin:', window.location.origin);
    </script>
</body>
</html>
